name: systemgate

services:
  systemgate:
    build: .
    container_name: systemgate-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8040:8040"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - ${SYSTEMGATE_BACKUP_ROOT:-~/systemgate-backups}:/backups:ro
    networks:
      - systemgate_net

networks:
  systemgate_net:
    name: systemgate_net
